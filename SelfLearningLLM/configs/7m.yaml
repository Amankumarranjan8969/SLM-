# configs/7m.yaml
#
# Smallest model size. Purpose: debug the ENTIRE pipeline cheaply
# (tokenizer -> data -> training loop -> checkpointing -> eval) before
# spending hours on the 56M target model. Should train fast enough on
# an RTX 4050 6GB to run the full loop (incl. a full epoch of a small
# TinyStories subset) in minutes, not hours.
#
# Analytic parameter count (see model/config.py::analytic_param_count):
#   ~7.15M params (verified by scripts/param_check, cross-checked
#   against the real nn.Module once model/llm.py exists in Phase 3)

model:
  name: "7m"
  vocab_size: 16384
  d_model: 256
  n_layers: 5
  n_query_heads: 4
  n_kv_heads: 2
  head_dim: 64
  d_ffn: 512
  context_length: 512
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  dropout: 0.0
  attn_dropout: 0.0
  tie_embeddings: true
  dtype: "bf16"

training:
  optimizer: "adamw"
  learning_rate: 6.0e-4
  min_learning_rate: 6.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 100
  max_steps: 3000
  lr_scheduler: "cosine"
  micro_batch_size: 16
  gradient_accumulation_steps: 2
  sequence_length: 512
  checkpoint_every: 250
  eval_every: 100
  log_every: 10
  keep_last_n_checkpoints: 3
  dataset_path: "data/train"
  val_dataset_path: "data/val"
  max_data_size_mb: 100
  max_tokens: 20000000
  seed: 1337

instruction:
  dataset_path: "data/instruction"
  learning_rate: 2.0e-4
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  max_steps: 500
  mask_prompt_loss: true
  user_token: "<USER>"
  assistant_token: "<ASSISTANT>"

self_learning:
  buffer_size: 200
  replay_old_data_fraction: 0.3
  regression_threshold: 0.98
  finetune_steps: 100
  finetune_learning_rate: 1.0e-4
  experiences_path: "data/experiences"
  regression_benchmark_path: "evaluation/regression_benchmark.jsonl"
  min_verified_before_training: 200

memory:
  use_faiss: true
  embedding_dim: 256
  short_term_max_turns: 20
  long_term_index_path: "self_learning/long_term_index"
  short_term_index_path: "self_learning/short_term_index"

runtime:
  device: "auto"
  vram_budget_gb: 6.0
  ram_budget_gb: 16.0
  auto_reduce_batch_on_oom: true
  min_micro_batch_size: 1
  num_workers: 2
  pin_memory: true
  compile_model: false
