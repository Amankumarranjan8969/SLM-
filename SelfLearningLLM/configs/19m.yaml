# configs/19m.yaml
#
# Intermediate model size. Purpose: confirm the pipeline still fits in
# 6GB VRAM and that loss curves behave sensibly at a larger scale before
# committing to a long 56M run.
#
# Analytic parameter count (see model/config.py::analytic_param_count):
#   ~18.88M params

model:
  name: "19m"
  vocab_size: 16384
  d_model: 384
  n_layers: 8
  n_query_heads: 6
  n_kv_heads: 2
  head_dim: 64
  d_ffn: 1024
  context_length: 512
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  dropout: 0.0
  attn_dropout: 0.0
  tie_embeddings: true
  dtype: "bf16"

training:
  optimizer: "adamw"
  learning_rate: 4.0e-4
  min_learning_rate: 4.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 150
  max_steps: 8000
  lr_scheduler: "cosine"
  micro_batch_size: 12
  gradient_accumulation_steps: 3
  sequence_length: 512
  checkpoint_every: 400
  eval_every: 200
  log_every: 10
  keep_last_n_checkpoints: 3
  dataset_path: "data/train"
  val_dataset_path: "data/val"
  max_data_size_mb: 500
  max_tokens: 80000000
  seed: 1337

instruction:
  dataset_path: "data/instruction"
  learning_rate: 1.5e-4
  micro_batch_size: 6
  gradient_accumulation_steps: 6
  max_steps: 1200
  mask_prompt_loss: true
  user_token: "<USER>"
  assistant_token: "<ASSISTANT>"

self_learning:
  buffer_size: 350
  replay_old_data_fraction: 0.3
  regression_threshold: 0.98
  finetune_steps: 200
  finetune_learning_rate: 7.0e-5
  experiences_path: "data/experiences"
  regression_benchmark_path: "evaluation/regression_benchmark.jsonl"
  min_verified_before_training: 350

memory:
  use_faiss: true
  embedding_dim: 384
  short_term_max_turns: 20
  long_term_index_path: "self_learning/long_term_index"
  short_term_index_path: "self_learning/short_term_index"

runtime:
  device: "auto"
  vram_budget_gb: 6.0
  ram_budget_gb: 16.0
  auto_reduce_batch_on_oom: true
  min_micro_batch_size: 1
  num_workers: 2
  pin_memory: true
  compile_model: false
